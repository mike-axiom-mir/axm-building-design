name: Hard-surface Building utility-panel receiver-clearance evidence

on:
  push:
    branches:
      - studio/hard-surface-utility-panel-receiver-clearance-001
  pull_request:
    paths:
      - "assets/utility_access_panel_001.json"
      - "assets/utility_access_panel_001_service_surface_domain.json"
      - "assets/utility_access_panel_001_receiver_clearance_envelope.json"
      - "assets/service_pavilion_001.json"
      - "tools/build_service_pavilion.py"
      - "tools/verify_utility_panel_receiver_clearance_envelope.py"
      - "tests/test_service_pavilion.py"
      - "tests/test_utility_panel_receiver_clearance_envelope.py"
      - ".github/workflows/hard-surface-building-utility-panel-receiver-clearance.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact owner head separately from GitHub event SHA
        run: |
          echo "AXM_EXACT_OWNER_HEAD=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source builder, verifier and tests
        run: |
          python -m py_compile tools/build_service_pavilion.py
          python -m py_compile tools/verify_utility_panel_receiver_clearance_envelope.py
          python -m py_compile tests/test_service_pavilion.py
          python -m py_compile tests/test_utility_panel_receiver_clearance_envelope.py

      - name: Run complete Building unit suite
        run: python -m unittest discover -s tests -v

      - name: Build exact owner-head receiver-clearance receipt
        run: |
          mkdir -p evidence/utility-panel-receiver-clearance
          git rev-parse HEAD > evidence/utility-panel-receiver-clearance/exact-owner-head.txt
          printf '%s\n' "$GITHUB_SHA" > evidence/utility-panel-receiver-clearance/github-event-sha.txt
          python tools/verify_utility_panel_receiver_clearance_envelope.py \
            --output evidence/utility-panel-receiver-clearance/receipt.json

      - name: Assert owner-head provenance is not confused with event SHA
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('evidence/utility-panel-receiver-clearance')
          owner_head = (root / 'exact-owner-head.txt').read_text().strip()
          event_sha = (root / 'github-event-sha.txt').read_text().strip()
          receipt = json.loads((root / 'receipt.json').read_text())
          assert owner_head == os.environ['AXM_EXACT_OWNER_HEAD']
          assert len(owner_head) == 40
          assert len(event_sha) == 40
          assert receipt['result'] == 'PASS_SOURCE_OWNED_BUILDING_UTILITY_PANEL_RECEIVER_CLEARANCE_ENVELOPE'
          assert receipt['panel_source_blob'] == '51b7fa61dd87934a89e033a2fdf5cc3b99992454'
          assert receipt['service_surface_domain_blob'] == '8b4484d4ccbd500e58910a2835d8780112489919'
          assert receipt['pavilion_source_blob'] == '5a5ec3ce6ee4e9b111db086ba93038a75c482a2e'
          assert receipt['downstream_adoption_authorized'] is False
          assert receipt['uc_or_pf_implementation_changed'] is False
          PY

      - name: Retain exact owner-head evidence on Python 3.11
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: building-utility-panel-receiver-clearance-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence/utility-panel-receiver-clearance/receipt.json
            evidence/utility-panel-receiver-clearance/exact-owner-head.txt
            evidence/utility-panel-receiver-clearance/github-event-sha.txt
            assets/utility_access_panel_001.json
            assets/utility_access_panel_001_service_surface_domain.json
            assets/utility_access_panel_001_receiver_clearance_envelope.json
            assets/service_pavilion_001.json
            tools/build_service_pavilion.py
