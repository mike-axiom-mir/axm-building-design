name: Geometry Building planar-role normal-boundary quotient evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Geometry quotient diagnostic
        run: |
          python -m py_compile tools/analyze_service_pavilion_planar_role_normal_boundary_quotient.py

      - name: Run complete Building test suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build exact-head quotient evidence
        shell: bash
        run: |
          set -euo pipefail
          EXACT_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          rm -rf evidence/service-pavilion-planar-role-normal-boundary-quotient-001
          python tools/analyze_service_pavilion_planar_role_normal_boundary_quotient.py \
            --exact-head "$EXACT_HEAD" \
            --output-dir evidence/service-pavilion-planar-role-normal-boundary-quotient-001 \
            > evidence-planar-role-normal-boundary-quotient-${{ matrix.python-version }}.json
          test "$(cat evidence/service-pavilion-planar-role-normal-boundary-quotient-001/exact-head.txt)" = "$EXACT_HEAD"

      - name: Truth gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('evidence/service-pavilion-planar-role-normal-boundary-quotient-001/normal-boundary-quotient-evidence.json')
          data = json.loads(path.read_text())
          metrics = data['metrics']
          assert data['result'] == 'PASS_HARD_NORMAL_IDENTITY_REMOVAL_YIELDS_EXACT_312_GROUP_STRUCTURAL_QUOTIENT'
          assert data['parent_geometry_head'] == 'b9b4ab63e23b9756ab79597e86ecc41ea75ea8b7'
          assert data['parent_candidate_sha256'] == 'f6a831058de66901fd42704b1d8c1cf187b13a0919ae3719c03c4369f107e6c0'
          assert metrics['parent_render_vertex_count'] == 604
          assert metrics['diagnostic_quotient_group_count'] == 312
          assert metrics['corner_index_count'] == 1008
          assert metrics['triangle_count'] == 336
          assert metrics['material_role_count'] == 5
          assert metrics['removed_source_vertex_identities'] == 292
          assert metrics['single_source_group_count'] == 124
          assert metrics['two_hard_normal_group_count'] == 84
          assert metrics['three_hard_normal_group_count'] == 104
          assert metrics['hard_normal_crossing_group_count'] == 188
          assert metrics['group_size_distribution'] == {'1': 124, '2': 84, '3': 104}
          assert metrics['per_role_quotient_group_count'] == {
              'frame_galvanized': 200,
              'infill_coating': 24,
              'roof_membrane': 36,
              'slab_mineral': 36,
              'utility_panel_ochre': 16,
          }
          assert metrics['every_parent_vertex_maps_exactly_once'] is True
          assert metrics['cross_material_merge_count'] == 0
          assert metrics['cross_position_merge_count'] == 0
          assert metrics['cross_protected_split_merge_count'] == 0
          assert all(str(value).startswith('REJECTED:') for value in data['negative_controls'].values())
          assert data['authority']['semantic_source'] == 'BUILDING_HARD_SURFACE'
          assert data['authority']['source_intent_indexed_geometry'] == 'BUILDING_GEOMETRY_TOPOLOGY_PR_12'
          assert all(data['authority'][key] == 'NOT_GEOMETRY_OWNED' for key in (
              'receiver_identity_or_adoption', 'transport_acceptance', 'runtime_acceptance', 'visual_acceptance'
          ))
          print(data['result'])
          print(json.dumps(metrics, indent=2, sort_keys=True))
          PY

      - name: Retain exact Geometry evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: service-pavilion-planar-role-normal-boundary-quotient-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/service-pavilion-planar-role-normal-boundary-quotient-001/
            evidence-planar-role-normal-boundary-quotient-${{ matrix.python-version }}.json
          if-no-files-found: error
