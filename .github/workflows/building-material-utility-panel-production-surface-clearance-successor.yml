name: Building material production-surface clearance-successor review

on:
  push:
    branches: [studio/materials-pavilion-surface-001]
    paths:
      - "lookdev/building_utility_panel_production_surface_clearance_successor_001.json"
      - "tools/build_building_utility_panel_production_surface_clearance_successor_rebind.py"
      - "lookdev-utility-panel-uv-proof/production_surface_clearance_successor_observe.gd"
      - ".github/workflows/building-material-utility-panel-production-surface-clearance-successor.yml"
  pull_request:
    paths:
      - "lookdev/building_utility_panel_production_surface_clearance_successor_001.json"
      - "tools/build_building_utility_panel_production_surface_clearance_successor_rebind.py"
      - "lookdev-utility-panel-uv-proof/production_surface_clearance_successor_observe.gd"
      - ".github/workflows/building-material-utility-panel-production-surface-clearance-successor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-surface-clearance-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      HARD_SURFACE_HEAD: fbfa3b47048755b45dac91451171d5511c8d4f47
      GEOMETRY_HEAD: 02944a9f10528a051603df3a6fd7b3183730773f
      PROCEDURAL_HEAD: 588350afba56dd1aa0417148f03e12c6cfc81610
    steps:
      - name: Checkout exact Materials head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Checkout exact Hard-Surface clearance owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: ${{ env.HARD_SURFACE_HEAD }}
          path: hard-surface-donor
          fetch-depth: 1

      - name: Checkout exact Geometry successor chart owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: ${{ env.GEOMETRY_HEAD }}
          path: geometry-donor
          fetch-depth: 1

      - name: Checkout exact Procedural receiver-rebind owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: ${{ env.PROCEDURAL_HEAD }}
          path: procedural-donor
          fetch-depth: 1

      - name: Verify exact owner identities
        run: |
          set -euo pipefail
          test "$(git -C hard-surface-donor rev-parse HEAD)" = "$HARD_SURFACE_HEAD"
          test "$(git -C hard-surface-donor rev-parse HEAD:assets/utility_access_panel_001.json)" = 51b7fa61dd87934a89e033a2fdf5cc3b99992454
          test "$(git -C hard-surface-donor rev-parse HEAD:assets/utility_access_panel_001_service_surface_domain.json)" = 8b4484d4ccbd500e58910a2835d8780112489919
          test "$(git -C hard-surface-donor rev-parse HEAD:assets/service_pavilion_001.json)" = 5a5ec3ce6ee4e9b111db086ba93038a75c482a2e
          test "$(git -C geometry-donor rev-parse HEAD)" = "$GEOMETRY_HEAD"
          test "$(git -C geometry-donor rev-parse HEAD:geometry/utility_access_panel_service_surface_chart_001.json)" = 08431f75edff5ae7d8b8c32468190e7a1b81d526
          test "$(git -C procedural-donor rev-parse HEAD)" = "$PROCEDURAL_HEAD"
          test "$(git rev-parse HEAD:lookdev/utility_panel_production_surface_001.json)" = 48e530af8174b3aa119a4b03f41ac72cc4d0a6cd

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run complete Building tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Re-execute exact Procedural clearance rebind
        env:
          AXM_CLEARANCE_DONOR_ROOT: ${{ github.workspace }}/hard-surface-donor
        run: |
          set -euo pipefail
          mkdir -p evidence/building_utility_panel_production_surface_clearance_successor
          python procedural-donor/tools/build_pavilion_utility_panel_clearance_rebind_family.py \
            --donor-root "$AXM_CLEARANCE_DONOR_ROOT" \
            --output evidence/building_utility_panel_production_surface_clearance_successor/procedural_rebind_summary.json

      - name: Generate exact Art-approved production surface bytes
        run: |
          set -euo pipefail
          python tools/build_utility_panel_production_surface_001.py generate \
            --recipe lookdev/utility_panel_production_surface_001.json \
            --output evidence/building_utility_panel_production_surface_clearance_successor/utility-panel-production-surface-001.png \
            --report evidence/building_utility_panel_production_surface_clearance_successor/production_surface_generation_report.json
          echo "fdf56d0c0b2e65a181a23cb5db4067555f188cce28ef2479fd5a71c8e11d220c  evidence/building_utility_panel_production_surface_clearance_successor/utility-panel-production-surface-001.png" | sha256sum --check --strict

      - name: Build exact Materials successor receiving packet
        env:
          MATERIALS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python tools/build_building_utility_panel_production_surface_clearance_successor_rebind.py build \
            --contract lookdev/building_utility_panel_production_surface_clearance_successor_001.json \
            --panel hard-surface-donor/assets/utility_access_panel_001.json \
            --surface-domain hard-surface-donor/assets/utility_access_panel_001_service_surface_domain.json \
            --pavilion hard-surface-donor/assets/service_pavilion_001.json \
            --geometry-chart geometry-donor/geometry/utility_access_panel_service_surface_chart_001.json \
            --procedural-summary evidence/building_utility_panel_production_surface_clearance_successor/procedural_rebind_summary.json \
            --recipe lookdev/utility_panel_production_surface_001.json \
            --texture evidence/building_utility_panel_production_surface_clearance_successor/utility-panel-production-surface-001.png \
            --materials-head "$MATERIALS_HEAD" \
            --hard-surface-head "$HARD_SURFACE_HEAD" \
            --geometry-head "$GEOMETRY_HEAD" \
            --procedural-head "$PROCEDURAL_HEAD" \
            --out evidence/building_utility_panel_production_surface_clearance_successor/generated

      - name: Negative control rejects successor standoff drift
        env:
          MATERIALS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cp hard-surface-donor/assets/utility_access_panel_001.json /tmp/mutated-panel.json
          python - <<'PY'
          import json
          p='/tmp/mutated-panel.json'
          d=json.load(open(p))
          d['standoff_from_receiver_origin_m']=0.099
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          set +e
          python tools/build_building_utility_panel_production_surface_clearance_successor_rebind.py build \
            --contract lookdev/building_utility_panel_production_surface_clearance_successor_001.json \
            --panel /tmp/mutated-panel.json \
            --surface-domain hard-surface-donor/assets/utility_access_panel_001_service_surface_domain.json \
            --pavilion hard-surface-donor/assets/service_pavilion_001.json \
            --geometry-chart geometry-donor/geometry/utility_access_panel_service_surface_chart_001.json \
            --procedural-summary evidence/building_utility_panel_production_surface_clearance_successor/procedural_rebind_summary.json \
            --recipe lookdev/utility_panel_production_surface_001.json \
            --texture evidence/building_utility_panel_production_surface_clearance_successor/utility-panel-production-surface-001.png \
            --materials-head "$MATERIALS_HEAD" \
            --hard-surface-head "$HARD_SURFACE_HEAD" \
            --geometry-head "$GEOMETRY_HEAD" \
            --procedural-head "$PROCEDURAL_HEAD" \
            --out /tmp/mutated-output
          code=$?
          set -e
          test "$code" -ne 0
          echo PASS_REJECTED_SUCCESSOR_STANDOFF_DRIFT

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render historical and clearance-successor production-surface contexts
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          mkdir -p lookdev-utility-panel-uv-proof/generated
          cp evidence/building_utility_panel_production_surface_clearance_successor/generated/runtime_contract.json \
             lookdev-utility-panel-uv-proof/generated/runtime_contract.json
          cp evidence/building_utility_panel_production_surface_clearance_successor/utility-panel-production-surface-001.png \
             lookdev-utility-panel-uv-proof/utility-panel-production-surface-001.png
          rm -f lookdev-utility-panel-uv-proof/utility-panel-clearance-*.png \
                lookdev-utility-panel-uv-proof/utility-panel-production-surface-clearance-successor-runtime-receipt.json
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path lookdev-utility-panel-uv-proof \
            --script production_surface_clearance_successor_observe.gd

      - name: Verify target-host comparison
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install --disable-pip-version-check --no-input pillow
          python tools/build_building_utility_panel_production_surface_clearance_successor_rebind.py verify-runtime \
            --runtime-contract evidence/building_utility_panel_production_surface_clearance_successor/generated/runtime_contract.json \
            --runtime-receipt lookdev-utility-panel-uv-proof/utility-panel-production-surface-clearance-successor-runtime-receipt.json \
            --render-root lookdev-utility-panel-uv-proof \
            --report evidence/building_utility_panel_production_surface_clearance_successor/target_host_report.json

      - name: Bind exact final Materials head
        env:
          MATERIALS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATERIALS_HEAD"
          printf '%s\n' "$MATERIALS_HEAD" > evidence/building_utility_panel_production_surface_clearance_successor/exact-head.txt

      - name: Retain exact successor evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: building-utility-panel-production-surface-clearance-successor-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lookdev/building_utility_panel_production_surface_clearance_successor_001.json
            lookdev/utility_panel_production_surface_001.json
            tools/build_building_utility_panel_production_surface_clearance_successor_rebind.py
            lookdev-utility-panel-uv-proof/production_surface_clearance_successor_observe.gd
            evidence/building_utility_panel_production_surface_clearance_successor/exact-head.txt
            evidence/building_utility_panel_production_surface_clearance_successor/build_receipt.json
            evidence/building_utility_panel_production_surface_clearance_successor/generated/runtime_contract.json
            evidence/building_utility_panel_production_surface_clearance_successor/procedural_rebind_summary.json
            evidence/building_utility_panel_production_surface_clearance_successor/production_surface_generation_report.json
            evidence/building_utility_panel_production_surface_clearance_successor/utility-panel-production-surface-001.png
            evidence/building_utility_panel_production_surface_clearance_successor/target_host_report.json
            hard-surface-donor/assets/utility_access_panel_001.json
            hard-surface-donor/assets/utility_access_panel_001_service_surface_domain.json
            hard-surface-donor/assets/service_pavilion_001.json
            geometry-donor/geometry/utility_access_panel_service_surface_chart_001.json
            lookdev-utility-panel-uv-proof/utility-panel-production-surface-clearance-successor-runtime-receipt.json
            lookdev-utility-panel-uv-proof/utility-panel-clearance-*.png
          if-no-files-found: warn
          retention-days: 30
