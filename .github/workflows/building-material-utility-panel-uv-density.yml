name: Building material utility-panel UV density evidence

on:
  push:
    branches: [studio/materials-pavilion-surface-001]
    paths:
      - "lookdev/building_utility_panel_uv_density_001.json"
      - "lookdev-utility-panel-uv-proof/**"
      - "tools/build_building_utility_panel_uv_density_evidence.py"
      - "tests/test_building_utility_panel_uv_density.py"
      - ".github/workflows/building-material-utility-panel-uv-density.yml"
  pull_request:
    paths:
      - "lookdev/building_utility_panel_uv_density_001.json"
      - "lookdev-utility-panel-uv-proof/**"
      - "tools/build_building_utility_panel_uv_density_evidence.py"
      - "tests/test_building_utility_panel_uv_density.py"
      - ".github/workflows/building-material-utility-panel-uv-density.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-building-utility-panel-uv-density:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout Building Materials lane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact current Building source donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 57f66b1245812f0c3d402232a046b86c0b5c72d8
          path: current-source-donor
          fetch-depth: 1

      - name: Checkout exact Geometry chart owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 79e09f68a05770eb6dabbbbbb3b008fc8e050aa0
          path: geometry-donor
          fetch-depth: 1

      - name: Checkout exact Hard-Surface service-domain owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 97120eb78a72b0a07aff1c65b9b92229d0a42aff
          path: surface-donor
          fetch-depth: 1

      - name: Verify exact owner identities
        run: |
          set -euo pipefail
          test "$(git -C current-source-donor rev-parse HEAD)" = 57f66b1245812f0c3d402232a046b86c0b5c72d8
          test "$(git -C geometry-donor rev-parse HEAD)" = 79e09f68a05770eb6dabbbbbb3b008fc8e050aa0
          test "$(git -C geometry-donor rev-parse HEAD:geometry/utility_access_panel_service_surface_chart_001.json)" = 56f1964b3360e371ac8c39d547cb300cd14fb997
          test "$(git -C surface-donor rev-parse HEAD)" = 97120eb78a72b0a07aff1c65b9b92229d0a42aff
          test "$(git -C surface-donor rev-parse HEAD:assets/utility_access_panel_001_service_surface_domain.json)" = 14037a0fb939104ea319c9ac96fbe9fdaa949a18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run complete Building tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Build exact current-source scalar material payload
        run: |
          python tools/build_building_material_lookdev_evidence.py \
            --source-root current-source-donor \
            --source-head 57f66b1245812f0c3d402232a046b86c0b5c72d8 \
            --out lookdev-utility-panel-uv-proof/generated/base

      - name: Build exact utility-panel physical UV density payload
        run: |
          python tools/build_building_utility_panel_uv_density_evidence.py \
            --geometry-chart geometry-donor/geometry/utility_access_panel_service_surface_chart_001.json \
            --surface-domain surface-donor/assets/utility_access_panel_001_service_surface_domain.json \
            --base-payload lookdev-utility-panel-uv-proof/generated/base/building_material_payload.json \
            --out lookdev-utility-panel-uv-proof/generated

      - name: Validate structural UV-density receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('lookdev-utility-panel-uv-proof/generated')
          r=json.loads((root/'build_receipt.json').read_text())
          p=json.loads((root/'utility_panel_uv_density_payload.json').read_text())
          assert r['result']=='PASS_BUILDING_UTILITY_PANEL_PHYSICAL_UV_DENSITY_PAYLOAD',r
          assert r['candidate']['texel_density_px_per_m']==[320.0,320.0],r
          assert r['candidate']['active_region_px']==[352,480],r
          assert r['candidate']['active_region_origin_px']==[80,16],r
          assert r['candidate']['checker_cells']==[22,30],r
          assert abs(r['candidate']['checker_period_m']-0.05)<1e-12,r
          assert r['candidate']['density_ratio_max_over_min']==1.0,r
          assert r['negative_control']['checker_cells']==[32,32],r
          assert r['negative_control']['density_ratio_max_over_min']>1.3,r
          assert p['owner_evidence']['geometry_chart_head']=='79e09f68a05770eb6dabbbbbb3b008fc8e050aa0',p
          assert p['owner_evidence']['hard_surface_domain_head']=='97120eb78a72b0a07aff1c65b9b92229d0a42aff',p
          assert p['truth_boundary']['production_uv_adopted'] is False,p
          assert p['truth_boundary']['production_texel_density_adopted'] is False,p
          print(json.dumps(r,indent=2))
          PY

      - name: Prove density drift fails closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('lookdev/building_utility_panel_uv_density_001.json')
          dst=Path('lookdev-utility-panel-uv-proof/generated/mutated-density-contract.json')
          data=json.loads(src.read_text())
          data['review_candidate']['texel_density_px_per_m']=321
          dst.write_text(json.dumps(data,indent=2)+'\n')
          PY
          if python tools/build_building_utility_panel_uv_density_evidence.py \
            --contract lookdev-utility-panel-uv-proof/generated/mutated-density-contract.json \
            --geometry-chart geometry-donor/geometry/utility_access_panel_service_surface_chart_001.json \
            --surface-domain surface-donor/assets/utility_access_panel_001_service_surface_domain.json \
            --base-payload lookdev-utility-panel-uv-proof/generated/base/building_material_payload.json \
            --out lookdev-utility-panel-uv-proof/generated/mutated-out; then
            echo "mutated density unexpectedly passed" >&2
            exit 1
          fi

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render physical-density and anisotropic negative in three contexts
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          rm -f lookdev-utility-panel-uv-proof/utility-panel-uv-density-runtime-receipt.json
          rm -f lookdev-utility-panel-uv-proof/utility-panel-uv-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path lookdev-utility-panel-uv-proof \
            --script observe.gd

      - name: Validate target-host physical-density evidence
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('lookdev-utility-panel-uv-proof')
          r=json.loads((root/'utility-panel-uv-density-runtime-receipt.json').read_text())
          assert r['state']=='PASS_TARGET_HOST_BUILDING_UTILITY_PANEL_PHYSICAL_UV_DENSITY_REVIEW',r
          assert set(r['contexts'])=={'front_service','east_service','three_quarter'},r
          assert r['candidate']['texel_density_px_per_m']==[320.0,320.0],r
          assert r['candidate']['checker_cells']==[22,30],r
          assert r['negative_control']['density_ratio_max_over_min']>1.3,r
          total=0
          for context,row in r['contexts'].items():
            assert row['physical_density']['overlay_count']==2,(context,row)
            assert row['normalized_full_square_negative']['overlay_count']==2,(context,row)
            diff=row['pixel_difference']
            assert diff['changed_pixels_gt_1lsb']>200,(context,diff)
            assert diff['max_rgb_channel_delta']>0.01,(context,diff)
            total += diff['changed_pixels_gt_1lsb']
            for variant in ('physical_density','normalized_full_square_negative'):
              path=root/f'utility-panel-uv-{context}-{variant}.png'
              assert path.stat().st_size>2000,path
          assert total>1500,total
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact Building utility-panel UV-density evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: building-utility-panel-uv-density-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lookdev/building_utility_panel_uv_density_001.json
            geometry-donor/geometry/utility_access_panel_service_surface_chart_001.json
            surface-donor/assets/utility_access_panel_001_service_surface_domain.json
            lookdev-utility-panel-uv-proof/generated/base/building_material_payload.json
            lookdev-utility-panel-uv-proof/generated/utility_panel_uv_density_payload.json
            lookdev-utility-panel-uv-proof/generated/build_receipt.json
            lookdev-utility-panel-uv-proof/utility-panel-uv-density-runtime-receipt.json
            lookdev-utility-panel-uv-proof/utility-panel-uv-*.png
          if-no-files-found: warn
          retention-days: 30
