name: Building material boundary-shell compaction evidence

on:
  push:
    branches: [studio/materials-pavilion-surface-001]
  pull_request:
    paths:
      - "lookdev/building_material_profile_001.json"
      - "lookdev-boundary-shell-compaction-proof/**"
      - "tools/build_building_material_boundary_shell_compaction_evidence.py"
      - ".github/workflows/building-material-boundary-shell-compaction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-shell-compaction-lookdev:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEOMETRY_HEAD: 43ace6fc44e6f6c0f637cd3436a94099c97c2d48
    steps:
      - name: Checkout exact Materials head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact Geometry compaction donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: ${{ env.GEOMETRY_HEAD }}
          path: geometry-donor
          fetch-depth: 1

      - name: Verify exact Geometry donor
        run: |
          set -euo pipefail
          test "$(git -C geometry-donor rev-parse HEAD)" = "$GEOMETRY_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and run complete Building tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Rebuild exact Geometry reference and compaction evidence
        run: |
          set -euo pipefail
          python geometry-donor/tools/build_service_pavilion_union_shell_candidate.py \
            --exact-head "$GEOMETRY_HEAD" \
            --output-dir geometry-donor/evidence/service-pavilion-boundary-shell-001
          python geometry-donor/tools/build_service_pavilion_boundary_shell_compaction.py \
            --exact-head "$GEOMETRY_HEAD" \
            --output-dir geometry-donor/evidence/service-pavilion-boundary-shell-compaction-001

      - name: Build Materials receiving packet
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf lookdev-boundary-shell-compaction-proof/generated
          python tools/build_building_material_boundary_shell_compaction_evidence.py \
            --geometry-root geometry-donor \
            --exact-head "$HEAD_SHA"

      - name: Validate exact material binding and representation reduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('lookdev-boundary-shell-compaction-proof/generated')
          r=json.loads((root/'build_receipt.json').read_text())
          p=json.loads((root/'payload.json').read_text())
          assert r['result']=='PASS_BUILDING_BOUNDARY_SHELL_COMPACTION_MATERIAL_BINDING_PACKET',r
          assert r['geometry_donor_head']=='43ace6fc44e6f6c0f637cd3436a94099c97c2d48',r
          assert r['reference_stats']['vertex_count']==1420,r
          assert r['reference_stats']['triangle_count']==2884,r
          assert r['compact_stats']['vertex_count']==1402,r
          assert r['compact_stats']['triangle_count']==2848,r
          assert r['reference_stats']['source_component_owner_count']==19,r
          assert r['compact_stats']['source_component_owner_count']==19,r
          assert r['geometry_evidence']['vertex_reduction']==18,r
          assert r['geometry_evidence']['triangle_reduction']==36,r
          assert r['geometry_evidence']['maximum_source_component_area_residual_m2'] <= 1e-9,r
          assert p['normal_policy']=='EXPLICIT_PER_TRIANGLE_PLANE_NORMAL__NO_VERTEX_SMOOTHING__HARD_SURFACE_REVIEW',p
          assert p['truth_boundary']['material_scalars_changed'] is False,p
          assert p['truth_boundary']['source_component_material_mapping_changed'] is False,p
          assert p['truth_boundary']['geometry_owned_by_materials'] is False,p
          print(json.dumps(r,indent=2))
          PY

      - name: Negative control rejects lost source-component material ownership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('geometry-donor/evidence/service-pavilion-boundary-shell-compaction-001/compacted-boundary-shell.json')
          data=json.loads(path.read_text())
          data['triangle_owners'][0]['source_component_id']='unknown-material-owner'
          path.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          if python tools/build_building_material_boundary_shell_compaction_evidence.py --geometry-root geometry-donor --exact-head NEGATIVE-CONTROL --out /tmp/negative; then
            echo "lost source-component material ownership unexpectedly passed" >&2
            exit 1
          fi

      - name: Rebuild exact packet after negative control
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -rf geometry-donor/evidence/service-pavilion-boundary-shell-compaction-001 lookdev-boundary-shell-compaction-proof/generated
          python geometry-donor/tools/build_service_pavilion_boundary_shell_compaction.py \
            --exact-head "$GEOMETRY_HEAD" \
            --output-dir geometry-donor/evidence/service-pavilion-boundary-shell-compaction-001
          python tools/build_building_material_boundary_shell_compaction_evidence.py \
            --geometry-root geometry-donor \
            --exact-head "$HEAD_SHA"

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render exact reference and compact receiving meshes
        run: |
          set -euo pipefail
          rm -f lookdev-boundary-shell-compaction-proof/runtime_receipt.json lookdev-boundary-shell-compaction-proof/*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1100x820x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path lookdev-boundary-shell-compaction-proof \
            --script observe.gd

      - name: Validate target-host capture and classify continuity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('lookdev-boundary-shell-compaction-proof')
          r=json.loads((root/'runtime_receipt.json').read_text())
          assert r['state']=='PASS_TARGET_HOST_BUILDING_BOUNDARY_SHELL_COMPACTION_MATERIAL_CONTINUITY_CAPTURED',r
          assert r['geometry_donor_head']=='43ace6fc44e6f6c0f637cd3436a94099c97c2d48',r
          assert set(r['contexts'])=={'front_service','east_service','three_quarter'},r
          fractions=[]
          for context,row in r['contexts'].items():
            assert row['reference']['state']=='PASS',(context,row)
            assert row['compact']['state']=='PASS',(context,row)
            assert row['comparison']['state']=='PASS',(context,row)
            fractions.append(float(row['comparison']['changed_fraction']))
            for variant in ('reference','compact'):
              path=root/f'{variant}-{context}.png'
              assert path.stat().st_size>2000,path
          r['continuity_decision'] = 'PASS_BOUNDED_EXPLICIT_HARD_NORMAL_MATERIAL_CONTINUITY' if max(fractions) <= 0.001 else 'HOLD_VISIBLE_RETRIANGULATION_SHADING_DELTA'
          (root/'runtime_receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact boundary-shell Materials evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: building-material-boundary-shell-compaction-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lookdev/building_material_profile_001.json
            lookdev-boundary-shell-compaction-proof/generated/payload.json
            lookdev-boundary-shell-compaction-proof/generated/build_receipt.json
            lookdev-boundary-shell-compaction-proof/runtime_receipt.json
            lookdev-boundary-shell-compaction-proof/reference-front_service.png
            lookdev-boundary-shell-compaction-proof/compact-front_service.png
            lookdev-boundary-shell-compaction-proof/reference-east_service.png
            lookdev-boundary-shell-compaction-proof/compact-east_service.png
            lookdev-boundary-shell-compaction-proof/reference-three_quarter.png
            lookdev-boundary-shell-compaction-proof/compact-three_quarter.png
          if-no-files-found: warn
          retention-days: 30
