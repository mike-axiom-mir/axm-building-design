name: Building material header segmentation evidence

on:
  push:
    branches: [studio/materials-pavilion-surface-001]
  pull_request:
    paths:
      - "lookdev/building_material_profile_001.json"
      - "lookdev-header-segmentation-proof/**"
      - "tools/build_building_material_header_segmentation_evidence.py"
      - ".github/workflows/building-material-header-segmentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header-segmentation-lookdev:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Materials head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact source-owned Hard-Surface successor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 34124101e616c423c5a3ed5e122ddf09b98a1650
          path: hard-surface-donor
          fetch-depth: 1

      - name: Verify exact Hard-Surface donor
        run: |
          set -euo pipefail
          test "$(git -C hard-surface-donor rev-parse HEAD)" = 34124101e616c423c5a3ed5e122ddf09b98a1650

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and run complete Building tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Build exact successor material-rebind payload
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/build_building_material_header_segmentation_evidence.py \
            --hard-surface-donor hard-surface-donor \
            --exact-head "$HEAD_SHA"

      - name: Validate exact source and fail-closed material coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('lookdev-header-segmentation-proof/generated')
          r=json.loads((root/'build_receipt.json').read_text())
          p=json.loads((root/'payload.json').read_text())
          assert r['result']=='PASS_SOURCE_OWNED_HEADER_SEGMENTATION_MATERIAL_REBIND_PAYLOAD',r
          assert r['hard_surface_source_head']=='34124101e616c423c5a3ed5e122ddf09b98a1650',r
          assert r['control_component_count']==19,r
          assert r['candidate_component_count']==23,r
          assert r['explicit_segment_binding_count']==6,r
          assert r['candidate_frame_component_count']==16,r
          assert p['header_segmentation_schema']=='axm.building-header-segmentation/v0.1',p
          assert p['successor_revision']=='service-pavilion-001/interpenetration-free-header-segmentation-003',p
          assert p['truth_boundary']['material_scalars_changed'] is False,p
          assert p['truth_boundary']['logical_material_roles_changed'] is False,p
          assert p['truth_boundary']['explicit_segment_id_binding'] is True,p
          assert p['truth_boundary']['wildcard_or_prefix_material_inference'] is False,p
          assert p['truth_boundary']['source_geometry_owned_by_materials'] is False,p
          assert p['truth_boundary']['map_receiving_equivalence'] is False,p
          print(json.dumps(r,indent=2))
          PY

      - name: Negative control rejects missing emitted segment binding
        run: |
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          profile=Path('lookdev/building_material_profile_001.json')
          data=json.loads(profile.read_text())
          removed=data['successor_representation_materials']['emitted_component_materials'].pop('front-header::segment-0')
          profile.write_text(json.dumps(data,indent=2)+'\n')
          print('removed',removed)
          PY
          if python tools/build_building_material_header_segmentation_evidence.py --hard-surface-donor hard-surface-donor --exact-head NEGATIVE-CONTROL --out /tmp/negative; then
            echo "missing segment binding unexpectedly passed" >&2
            exit 1
          fi
          git checkout -- lookdev/building_material_profile_001.json

      - name: Rebuild exact payload after negative control
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -rf lookdev-header-segmentation-proof/generated
          python tools/build_building_material_header_segmentation_evidence.py \
            --hard-surface-donor hard-surface-donor \
            --exact-head "$HEAD_SHA"

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render exact logical and segmented source representations
        run: |
          set -euo pipefail
          rm -f lookdev-header-segmentation-proof/runtime_receipt.json lookdev-header-segmentation-proof/*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1100x820x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path lookdev-header-segmentation-proof \
            --script observe.gd

      - name: Validate target-host material continuity receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('lookdev-header-segmentation-proof')
          r=json.loads((root/'runtime_receipt.json').read_text())
          assert r['state']=='PASS_TARGET_HOST_BUILDING_HEADER_SEGMENTATION_MATERIAL_CONTINUITY',r
          assert r['hard_surface_source_head']=='34124101e616c423c5a3ed5e122ddf09b98a1650',r
          assert set(r['contexts'])=={'front_service','east_service','three_quarter'},r
          for context,row in r['contexts'].items():
            assert row['control']['component_count']==19,(context,row)
            assert row['candidate']['component_count']==23,(context,row)
            assert row['candidate']['material_counts']['frame_galvanized']==16,(context,row)
            assert row['comparison']['state']=='PASS',(context,row)
            assert row['comparison']['changed_fraction'] <= 0.01,(context,row)
            for variant in ('logical_pre_segmentation','source_owned_segmented_headers'):
              path=root/f'{variant}-{context}.png'
              assert path.stat().st_size>2000,path
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact header segmentation Materials evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: building-material-header-segmentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lookdev/building_material_profile_001.json
            lookdev-header-segmentation-proof/generated/payload.json
            lookdev-header-segmentation-proof/generated/build_receipt.json
            lookdev-header-segmentation-proof/runtime_receipt.json
            lookdev-header-segmentation-proof/logical_pre_segmentation-front_service.png
            lookdev-header-segmentation-proof/source_owned_segmented_headers-front_service.png
            lookdev-header-segmentation-proof/logical_pre_segmentation-east_service.png
            lookdev-header-segmentation-proof/source_owned_segmented_headers-east_service.png
            lookdev-header-segmentation-proof/logical_pre_segmentation-three_quarter.png
            lookdev-header-segmentation-proof/source_owned_segmented_headers-three_quarter.png
          if-no-files-found: warn
          retention-days: 30
