name: Hard-surface building evidence

on:
  pull_request:
  push:
    branches:
      - studio/hard-surface-pavilion-interface-001

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source head
        run: |
          echo "AXM_EXACT_HEAD=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall tools tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build exact structural evidence
        if: matrix.python-version == '3.11'
        run: python tools/build_service_pavilion.py --exact-head "$AXM_EXACT_HEAD" --output-dir evidence/service-pavilion-001
      - name: Build exact named-result compatibility evidence
        if: matrix.python-version == '3.11'
        run: python tools/verify_service_pavilion_build_result.py --exact-head "$AXM_EXACT_HEAD" --output-dir evidence/service-pavilion-001
      - name: Verify exact retained binding, source topology and named result
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('evidence/service-pavilion-001')
          receipt = json.loads((root / 'receipt.json').read_text())
          interface = json.loads((root / 'build-result-contract.json').read_text())
          exact = os.environ['AXM_EXACT_HEAD']
          assert receipt['exact_hard_surface_head'] == exact
          assert (root / 'exact-head.txt').read_text().strip() == exact
          assert receipt['result'] == 'PASS_BUILDING_PANEL_RECEIVER_PATTERN_PROOF'
          assert receipt['source_topology_result'] == 'PASS_SOURCE_OWNED_CLOSED_OUTWARD_BOX_SHELLS_19_REAL_OUTPUTS'
          topo = receipt['source_topology']
          assert topo['object_count'] == 19
          assert topo['vertex_count'] == 152
          assert topo['triangle_count'] == 228
          assert topo['boundary_edge_count'] == 0
          assert topo['nonmanifold_edge_count'] == 0
          assert topo['orientation_conflict_edge_count'] == 0
          assert topo['outward_triangle_count'] == 228
          assert topo['inward_triangle_count'] == 0
          assert topo['historical_predecessor_rejection'].startswith('REJECTED:')
          assert topo['single_triangle_flip_rejection'].startswith('REJECTED:')
          assert interface['exact_hard_surface_head'] == exact
          assert interface['result'] == 'PASS_VERSIONED_NAMED_BUILD_RESULT_WITH_LEGACY_TUPLE_COMPATIBILITY'
          named = interface['contract']
          assert named['schema'] == 'axm.building-build-result/v0.1'
          assert named['legacy_output_count_observed'] == 9
          assert named['opaque_trailing_extension_count'] == 0
          assert named['topology_revision'] == 'closed-outward-12-triangle-v1'
          assert named['topology_object_count'] == 19
          assert named['legacy_current_required_payload_sha256'] == named['named_current_required_payload_sha256']
          assert interface['future_trailing_extension_control'] == 'PASS_EXISTING_NAMED_FIELDS_UNCHANGED'
          assert interface['missing_topology_control'].startswith('REJECTED:')
          assert interface['missing_named_dependency_control'].startswith('REJECTED:')
          assert interface['schema_drift_control'].startswith('REJECTED:')
          PY
      - name: Retain evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: service-pavilion-001-hard-surface-evidence
          path: evidence/service-pavilion-001
          if-no-files-found: error
