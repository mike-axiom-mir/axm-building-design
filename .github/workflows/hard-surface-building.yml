name: Hard-surface building evidence

on:
  pull_request:
  push:
    branches:
      - studio/hard-surface-pavilion-interface-001

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall tools tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build exact structural evidence
        if: matrix.python-version == '3.11'
        run: python tools/build_service_pavilion.py --output-dir evidence/service-pavilion-001
      - name: Retain evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: service-pavilion-001-hard-surface-evidence
          path: evidence/service-pavilion-001
          if-no-files-found: error
